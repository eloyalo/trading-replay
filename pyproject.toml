[project]
name = "trading-replay"
version = "0.1.0"
description = "Simulador local de trading con replay de histórico, cuentas demo y retos de prop firm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.115",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
trading-replay = "trading_replay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/trading_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
